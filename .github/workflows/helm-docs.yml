name: Helm documentation examples

on:
  pull_request:
    paths:
      - 'docs/source/content/user_documentation/helm/**'
      - '.github/scripts/check_helm_docs.py'
      - '.github/workflows/helm-docs.yml'
  push:
    branches: [master]
    paths:
      - 'docs/source/content/user_documentation/helm/**'
      - '.github/scripts/check_helm_docs.py'
      - '.github/workflows/helm-docs.yml'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      chart_version:
        description: 'Exact stable chart version (empty checks the latest stable release)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        chart_version: ['3.17.0', '']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: azure/setup-helm@v4
        with:
          version: 'v3.19.0'
      - run: python -m pip install PyYAML==6.0.3
      - name: Check the documented examples
        env:
          CHART_VERSION: ${{ inputs.chart_version || matrix.chart_version }}
        run: python .github/scripts/check_helm_docs.py --chart-version "$CHART_VERSION"
